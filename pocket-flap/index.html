<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#183f43"><meta name="description" content="A little bird. A big sky. Tap to fly in Pocket Flap."><title>Pocket Flap</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:#14383d;color:#fff7db;font-family:ui-rounded,'Arial Rounded MT Bold',system-ui,sans-serif;display:grid;place-items:center;touch-action:none;-webkit-user-select:none;user-select:none}main{position:relative;width:min(100%,460px);height:100dvh;max-height:920px;overflow:hidden;background:#b5dfce;box-shadow:0 0 90px #0004}canvas{width:100%;height:100%;display:block}header{position:absolute;top:max(22px,env(safe-area-inset-top));left:24px;right:24px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.brand{font-size:12px;letter-spacing:3px;font-weight:900;color:#234b44}.sound{pointer-events:auto;border:1px solid #254b4430;border-radius:50%;width:42px;height:42px;background:#fff8;color:#234b44;font-size:18px;cursor:pointer}.score{position:absolute;top:80px;left:0;right:0;text-align:center;font-size:64px;font-weight:900;color:#fff9df;text-shadow:0 4px #234b4430;pointer-events:none}.panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;pointer-events:none}.panel.hidden{display:none}.eyebrow{font-size:11px;letter-spacing:4px;font-weight:800;color:#31584e;margin-bottom:12px}h1{font-size:65px;line-height:.94;letter-spacing:-4px;margin:0;color:#fff9df;text-shadow:0 4px 0 #335d4950}h1 span{color:#264e43}p{font-size:15px;color:#31584e;line-height:1.6;margin:18px 0 26px}.card{background:#fff8de;border:2px solid #254c4220;border-radius:22px;box-shadow:0 8px 0 #254c4220;padding:20px 28px;width:100%;max-width:290px;margin:22px 0;display:flex;justify-content:space-around;color:#244e43}.card small{display:block;text-transform:uppercase;letter-spacing:2px;font-size:10px;font-weight:800;margin-bottom:5px}.card strong{font-size:32px}button.play{pointer-events:auto;border:0;border-bottom:5px solid #bd683e;border-radius:16px;padding:17px 38px;background:#ef9260;color:#fff9df;font:900 17px system-ui;cursor:pointer;box-shadow:0 6px 18px #234b4420}button.play:active{transform:translateY(3px);border-bottom-width:2px}.hint{position:absolute;bottom:max(36px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#536a42;font-size:10px;font-weight:800;letter-spacing:2px;pointer-events:none}#ready .bird-space{height:94px}#over h1{font-size:49px;letter-spacing:-2px}#over{background:#b5dfce65;backdrop-filter:blur(4px)}@media(max-height:570px){h1{font-size:45px}#ready .bird-space{height:35px}p{margin:12px 0}.score{top:45px;font-size:42px}}
</style></head><body><main aria-label="Pocket Flap game"><canvas id="game" aria-label="Tap or press space to flap and avoid pipes"></canvas><header><div class="brand">POCKET FLAP ↗</div><button class="sound" id="sound" aria-label="Enable sound">♪</button></header><div class="score" id="score" hidden>0</div><section class="panel" id="ready"><div class="eyebrow">ONE MORE LITTLE ADVENTURE</div><h1>Small bird.<br><span>Big sky.</span></h1><div class="bird-space"></div><p>Find your rhythm. Chase the horizon.<br>Tap anywhere to keep flying.</p><button class="play" id="start">Let’s fly ↗</button></section><section class="panel hidden" id="over"><div class="eyebrow" id="message">A LITTLE HIGHER NEXT TIME</div><h1>Nice flight.</h1><div class="card"><div><small>Score</small><strong id="result">0</strong></div><div><small>Best</small><strong id="best">0</strong></div></div><button class="play" id="restart">Fly again ↗</button><p>Every flap is a fresh start.</p></section><div class="hint" id="hint">TAP TO FLAP · SPACE ON DESKTOP</div></main><script>
(()=>{'use strict';const c=document.querySelector('canvas'),ctx=c.getContext('2d'),$=s=>document.getElementById(s);const W=400,H=720,ground=650,birdX=105,r=14;let state='ready',y=300,v=0,pipes=[],score=0,best=0,time=0,spawn=0,last=0,deadAt=0,muted=true,audio;try{best=Number(localStorage.getItem('pocket-flap-best'))||0}catch{}function resize(){const d=Math.min(devicePixelRatio||1,3);c.width=Math.round(c.clientWidth*d);c.height=Math.round(c.clientHeight*d)}addEventListener('resize',resize);resize();function tone(f,d=.08){if(muted)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.setValueAtTime(f,audio.currentTime);o.frequency.exponentialRampToValueAtTime(f*.65,audio.currentTime+d);g.gain.setValueAtTime(.045,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.start();o.stop(audio.currentTime+d)}catch{}}function flap(){v=-330;tone(620)}function start(){state='playing';y=300;v=0;pipes=[];spawn=.75;score=0;$('score').textContent=0;$('score').hidden=false;$('ready').classList.add('hidden');$('over').classList.add('hidden');$('hint').style.opacity=0;flap()}function die(){if(state!=='playing')return;state='over';deadAt=performance.now();tone(140,.22);let record=score>best;best=Math.max(score,best);try{localStorage.setItem('pocket-flap-best',best)}catch{}$('result').textContent=score;$('best').textContent=best;$('message').textContent=record?'A NEW PERSONAL BEST':'A LITTLE HIGHER NEXT TIME';$('over').classList.remove('hidden');$('score').hidden=true}function action(){if(state==='ready')start();else if(state==='playing')flap();else if(performance.now()-deadAt>400)start()}c.addEventListener('pointerdown',e=>{e.preventDefault();action()});$('start').onclick=start;$('restart').onclick=()=>{if(performance.now()-deadAt>400)start()};$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'♪':'♫';$('sound').setAttribute('aria-label',muted?'Enable sound':'Mute sound');tone(700)};addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!e.repeat)action()}});document.addEventListener('visibilitychange',()=>{last=0});function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}function cloud(x,y,s){ctx.fillStyle='#eff7db88';ctx.beginPath();ctx.roundRect(x,y,78*s,18*s,12*s);ctx.fill();ellipse(x+28*s,y,18*s,18*s,'#eff7db88');ellipse(x+49*s,y+1*s,14*s,14*s,'#eff7db88')}function pipe(p){for(const [top,bottom]of [[-20,p.gap-88],[p.gap+88,ground]]){let g=ctx.createLinearGradient(p.x,0,p.x+60,0);g.addColorStop(0,'#427c61');g.addColorStop(.2,'#6c9d72');g.addColorStop(.8,'#56875e');g.addColorStop(1,'#356650');ctx.fillStyle=g;ctx.fillRect(p.x,top,60,bottom-top);ctx.fillStyle='#88ad7b';ctx.fillRect(p.x+8,top,4,bottom-top);const cap=top<0?bottom-23:top;ctx.fillStyle='#315b48';ctx.fillRect(p.x-4,cap,68,25);ctx.fillStyle='#79a571';ctx.fillRect(p.x-2,cap+2,64,18);ctx.fillStyle='#a5c18b';ctx.fillRect(p.x,cap+3,60,3)}}function bird(){ctx.save();ctx.translate(birdX,y);ctx.rotate(state==='playing'?Math.max(-.4,Math.min(1.2,v/650)):-.12);ellipse(1,3,20,17,'#b87a3b');ellipse(0,0,20,17,'#f5c954');ellipse(-10,4,11,7+Math.sin(time*22)*2,'#f5e795');ellipse(9,-5,8,9,'#fff9df');ellipse(12,-4,3,4,'#24483f');ctx.fillStyle='#ed9060';ctx.beginPath();ctx.moveTo(17,0);ctx.lineTo(29,5);ctx.lineTo(17,9);ctx.fill();ctx.restore()}function draw(){ctx.setTransform(c.width/W,0,0,c.height/H,0,0);const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#a6d5c7');sky.addColorStop(1,'#e2ebbd');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ellipse(330,147,49,49,'#f6f1ccaa');cloud(40-(time*5)%500,170,1);cloud(290-(time*8)%600,275,.8);cloud(150-(time*4)%500,90,.5);ctx.fillStyle='#98bd9d';ctx.beginPath();ctx.moveTo(0,600);for(let x=0;x<=420;x+=10)ctx.lineTo(x,565+Math.sin(x/65+1)*22);ctx.lineTo(420,ground);ctx.lineTo(0,ground);ctx.fill();ctx.fillStyle='#7ea988';ctx.beginPath();ctx.moveTo(0,ground);for(let x=0;x<=420;x+=10)ctx.lineTo(x,605+Math.sin(x/45)*17);ctx.lineTo(420,ground);ctx.fill();pipes.forEach(pipe);ctx.fillStyle='#4c7852';ctx.fillRect(0,ground,W,6);ctx.fillStyle='#b4c788';ctx.fillRect(0,ground+6,W,10);ctx.fillStyle='#ebdcb0';ctx.fillRect(0,ground+16,W,H-ground);ctx.fillStyle='#d2c498';for(let i=-1;i<22;i++)ctx.fillRect(i*25-(time*70)%25,ground+22,12,3);bird()}function frame(now){let dt=last?Math.min((now-last)/1000,.033):0;last=now;if(!document.hidden){time+=dt;if(state==='ready')y=338+Math.sin(time*3)*7;if(state==='playing'){let speed=145+Math.min(score*2,45);v+=1000*dt;y+=v*dt;spawn-=dt;if(spawn<=0){pipes.push({x:440,gap:210+Math.random()*245,passed:false});spawn=1.55}for(const p of pipes){p.x-=speed*dt;if(!p.passed&&p.x+60<birdX-r){p.passed=true;score++;$('score').textContent=score;tone(940,.12)}if(birdX+r>p.x-4&&birdX-r<p.x+64&&(y-r<p.gap-88||y+r>p.gap+88))die()}pipes=pipes.filter(p=>p.x>-80);if(y+r>=ground||y-r<=0)die()}draw()}requestAnimationFrame(frame)}requestAnimationFrame(frame)})();
</script></body></html>
